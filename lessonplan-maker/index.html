<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonPlan Maker — NCERT Curriculum Planning Workbench</title>
    <meta name="description" content="Pedagogical lesson planning workbench for NCERT Classes 6–8 with structured learning outcomes, 5E inquiry methodology, and assessment rubrics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .lpm-wrapper {
            max-width: 1080px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .lpm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        .lpm-title-group h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .lpm-title-group p {
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .lpm-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            background: var(--accent-dim);
            color: var(--accent-secondary);
            border: 1px solid var(--accent-border);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
        }
        .lpm-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 32px;
        }
        .lpm-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 24px;
        }
        .lpm-panel h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
        }
        .lpm-field {
            margin-bottom: 16px;
        }
        .lpm-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .lpm-select, .lpm-input {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.88rem;
        }
        .lpm-btn-generate {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-main);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 8px;
        }
        .lpm-btn-generate:hover {
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
        }
        .plan-preview {
            background: #0d0d12;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 32px;
            min-height: 480px;
            font-size: 0.92rem;
            line-height: 1.7;
        }
        .plan-preview h3 {
            font-size: 1.3rem;
            color: var(--accent-secondary);
            margin-bottom: 12px;
        }
        .plan-section {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .plan-section h4 {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .plan-section ul {
            padding-left: 20px;
            color: var(--text-secondary);
        }
        .print-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .print-btn:hover {
            border-color: var(--accent-primary);
        }
        @media (max-width: 820px) {
            .lpm-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body style="background-color: var(--bg-main);">

    <div class="lpm-wrapper">
        <div style="margin-bottom: 20px;">
            <a href="../index.html#projects" class="case-back-link" style="display: inline-flex; align-items: center; gap: 6px;">
                ← Back to Portfolio
            </a>
        </div>

        <header class="lpm-header">
            <div class="lpm-title-group">
                <h1>LessonPlan Maker</h1>
                <p>Curriculum Planning & 5E Pedagogical Structuring for NCERT Classes 6–8</p>
            </div>
            <span class="lpm-badge">Active Prototype • v0.9 Beta</span>
        </header>

        <div class="lpm-grid">
            <!-- Left Config Panel -->
            <div class="lpm-panel">
                <h2>Curriculum Parameters</h2>
                
                <div class="lpm-field">
                    <label class="lpm-label">Grade / Class</label>
                    <select id="grade-select" class="lpm-select">
                        <option value="6">Class 6 (Middle Stage)</option>
                        <option value="7" selected>Class 7 (Middle Stage)</option>
                        <option value="8">Class 8 (Middle Stage)</option>
                    </select>
                </div>

                <div class="lpm-field">
                    <label class="lpm-label">Subject Domain</label>
                    <select id="subject-select" class="lpm-select">
                        <option value="science">Science (NCERT / Curiosity)</option>
                        <option value="math">Mathematics (Ganita)</option>
                        <option value="social">Social Science (Our Past & Environment)</option>
                        <option value="english">English (Honeycombs / Language Arts)</option>
                    </select>
                </div>

                <div class="lpm-field">
                    <label class="lpm-label">Curriculum Unit / Topic</label>
                    <select id="topic-select" class="lpm-select">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="lpm-field">
                    <label class="lpm-label">Duration</label>
                    <select id="duration-select" class="lpm-select">
                        <option value="40">Single Period (40 mins)</option>
                        <option value="80" selected>Double Period / Block (80 mins)</option>
                        <option value="week">Full Chapter Sequence (5 Days)</option>
                    </select>
                </div>

                <div class="lpm-field">
                    <label class="lpm-label">Pedagogical Framework</label>
                    <select id="framework-select" class="lpm-select">
                        <option value="5e">5E Inquiry Model (Engage, Explore, Explain, Elaborate, Evaluate)</option>
                        <option value="blooms">Bloom's Revised Taxonomy (Outcome-Driven)</option>
                    </select>
                </div>

                <button class="lpm-btn-generate" id="generate-btn">Generate Structured Plan →</button>
            </div>

            <!-- Right Preview Panel -->
            <div class="lpm-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px;">
                    <h2 style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">Plan Output</h2>
                    <button class="print-btn" onclick="window.print()">Print / Export PDF</button>
                </div>

                <div class="plan-preview" id="plan-output">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const topics = {
            science: [
                "Nutrition in Plants (Photosynthesis & Autotrophs)",
                "Heat & Temperature (Conduction, Convection & Radiation)",
                "Acids, Bases and Salts (Natural Indicators & Neutralization)",
                "Respiration in Organisms (Cellular Energy & Breathing Mechanisms)",
                "Light (Spherical Mirrors & Reflection Laws)"
            ],
            math: [
                "Integers (Properties of Addition & Multiplication)",
                "Fractions and Decimals (Multiplication & Division of Fractions)",
                "Simple Equations (Transposition Method & Word Problems)",
                "The Triangle and its Properties (Angle Sum & Exterior Angle Theorem)",
                "Rational Numbers (Representation on Number Line & Density)"
            ],
            social: [
                "Traders, Kings and Pilgrims (Silk Route & Trade Networks)",
                "New Kings and Kingdoms (Cholas, Administration & Agrarian Expansion)",
                "Our Environment (Ecosystem, Biotic & Abiotic Components)",
                "Understanding Media (Role of Media in Democratic Accountability)"
            ],
            english: [
                "The Three Questions (Leo Tolstoy) — Critical Comprehension & Ethics",
                "A Gift of Chappals — Empathy, Values & Narrative Structure",
                "Formal Letter Writing — Inquiries, Requests & Municipal Concerns"
            ]
        };

        const subjectSelect = document.getElementById('subject-select');
        const topicSelect = document.getElementById('topic-select');
        const gradeSelect = document.getElementById('grade-select');
        const generateBtn = document.getElementById('generate-btn');
        const output = document.getElementById('plan-output');

        function updateTopics() {
            const sub = subjectSelect.value;
            topicSelect.innerHTML = '';
            topics[sub].forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                topicSelect.appendChild(opt);
            });
        }

        subjectSelect.addEventListener('change', updateTopics);
        updateTopics();

        function generatePlan() {
            const grade = gradeSelect.value;
            const sub = subjectSelect.options[subjectSelect.selectedIndex].text;
            const topic = topicSelect.value;
            const duration = document.getElementById('duration-select').options[document.getElementById('duration-select').selectedIndex].text;

            output.innerHTML = `
                <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 16px; margin-bottom: 20px;">
                    <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent-secondary); letter-spacing: 0.1em; text-transform: uppercase;">
                        NCERT Pedagogical Plan • Class ${grade} • ${sub}
                    </div>
                    <h3 style="font-size: 1.45rem; color: #ffffff; margin-top: 6px;">${topic}</h3>
                    <div style="font-size: 0.82rem; color: var(--text-muted);">Allocated Duration: ${duration} • Framework: 5E Inquiry Cycle</div>
                </div>

                <div class="plan-section">
                    <h4>1. Specific Learning Outcomes (SLOs)</h4>
                    <ul>
                        <li>Students will explain core concepts and principles behind <strong>${topic}</strong> with real-world analogies.</li>
                        <li>Differentiate and categorize related phenomena through guided inquiry observations.</li>
                        <li>Formulate hypotheses, record observations, and construct evidence-based conclusions.</li>
                    </ul>
                </div>

                <div class="plan-section">
                    <h4>2. 5E Pedagogical Sequence</h4>
                    <ul>
                        <li><strong>Engage (10 min):</strong> Open-ended provocation question connecting students' everyday experiences to the underlying phenomenon.</li>
                        <li><strong>Explore (25 min):</strong> Collaborative small-group hands-on activity / guided reading with concrete artifacts and peer recording.</li>
                        <li><strong>Explain (20 min):</strong> Student presentations of observed patterns, followed by teacher synthesis and introduction of precise scientific/mathematical terminology.</li>
                        <li><strong>Elaborate (15 min):</strong> Extended problem-solving task applying the newly formed conceptual framework to unfamiliar scenarios.</li>
                        <li><strong>Evaluate (10 min):</strong> Quick formative exit ticket with 3 tiered diagnostic questions checking conceptual grasp.</li>
                    </ul>
                </div>

                <div class="plan-section">
                    <h4>3. Differentiated Support & Rubric</h4>
                    <ul>
                        <li><strong>Scaffolding (Tier 1):</strong> Visual anchor charts, sentence stems, and step-by-step graphic organizers.</li>
                        <li><strong>Enrichment (Tier 3):</strong> Extension challenge analyzing counter-examples and historical developments in Indian & global science.</li>
                        <li><strong>Assessment Metric:</strong> Conceptual Clarity (40%), Scientific Reasoning (30%), Collaborative Communication (30%).</li>
                    </ul>
                </div>
            `;
        }

        generateBtn.addEventListener('click', generatePlan);
        generatePlan();
    </script>
</body>
</html>
